name: telemetry-stack

# Grafana observability stack:
#   Alloy  - OpenTelemetry collector (OTLP + Faro ingest)
#   Loki   - logs
#   Tempo  - traces
#   Mimir  - metrics (Prometheus-compatible, long-term storage)
#   MinIO  - S3-compatible object storage backing Loki/Tempo/Mimir
#   Grafana- querying & dashboards
#
# The config files under config/ are shared with the Docker-free install in
# bare-metal/ and read their ports, paths and storage backend from the
# environment. That is what the env blocks below are for — keep them in sync
# with bare-metal/env.example.sh when adding a setting.

x-restart: &restart
  restart: unless-stopped

# Where the backends put their data. In Compose this is always MinIO.
x-storage-env: &storage-env
  S3_URL: http://minio:9000
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-telemetry}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-telemetry-secret}
  S3_INSECURE: "true"

# Addresses of the backends, as seen from inside the Compose network.
x-endpoints-env: &endpoints-env
  LOKI_URL: http://loki:3100
  TEMPO_URL: http://tempo:3200
  MIMIR_URL: http://mimir:9009
  TEMPO_OTLP_ENDPOINT: tempo:4317

services:
  minio:
    <<: *restart
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-telemetry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-telemetry-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "9001:9001" # console (optional)

  # One-shot job that creates the buckets the backends need.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/loki-data local/tempo-data local/mimir-blocks local/mimir-ruler local/mimir-alertmanager
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-telemetry}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-telemetry-secret}

  loki:
    <<: *restart
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      <<: [*storage-env, *endpoints-env]
      LOKI_HTTP_PORT: "3100"
      LOKI_GRPC_PORT: "9096"
      LOKI_DATA: /loki
      LOKI_OBJECT_STORE: s3
      LOKI_S3_BUCKET: loki-data
      LOKI_INSTANCE_ADDR: ""   # empty = auto-detect the container IP
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    depends_on:
      minio-init:
        condition: service_completed_successfully

  tempo:
    <<: *restart
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      <<: [*storage-env, *endpoints-env]
      TEMPO_HTTP_PORT: "3200"
      TEMPO_GRPC_PORT: "9095"
      TEMPO_OTLP_GRPC_PORT: "4317"
      TEMPO_OTLP_HTTP_PORT: "4318"
      TEMPO_DATA: /var/tempo
      TEMPO_BACKEND: s3
      TEMPO_S3_BUCKET: tempo-data
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      minio-init:
        condition: service_completed_successfully

  mimir:
    <<: *restart
    image: grafana/mimir:2.14.2
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    environment:
      <<: [*storage-env, *endpoints-env]
      MIMIR_HTTP_PORT: "9009"
      MIMIR_GRPC_PORT: "9095"
      MIMIR_MEMBERLIST_PORT: "7946"
      MIMIR_RING_STORE: memberlist
      MIMIR_ADVERTISE_ADDR: ""      # empty = auto-detect the container IP
      MIMIR_INSTANCE_ADDR: ""       # empty = auto-detect the container IP
      MIMIR_DATA: /data
      MIMIR_BACKEND: s3
      MIMIR_BLOCKS_BUCKET: mimir-blocks
      MIMIR_RULER_BUCKET: mimir-ruler
      MIMIR_ALERTMANAGER_BUCKET: mimir-alertmanager
    volumes:
      - ./config/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  alloy:
    <<: *restart
    image: grafana/alloy:v1.6.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      <<: *endpoints-env
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12347:12347" # Faro (browser telemetry)
      - "12345:12345" # Alloy UI (optional)
    depends_on:
      - loki
      - tempo
      - mimir

  grafana:
    <<: *restart
    image: grafana/grafana:11.4.0
    environment:
      <<: *endpoints-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,exemplars
      GF_DASHBOARDS_PATH: /var/lib/grafana/dashboards
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - mimir

volumes:
  minio-data:
  loki-data:
  tempo-data:
  mimir-data:
  alloy-data:
  grafana-data:
