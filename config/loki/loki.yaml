# Loki single-binary. Storage backend and paths come from the environment so
# the same file serves both Docker Compose and the bare-metal install
# (see bare-metal/env.example.sh). Requires -config.expand-env=true.
#
# NOTE: only plain ${VAR} is used, never ${VAR:-default}. Mimir does not
# support the default form, so for consistency every variable is set
# explicitly by whichever launcher starts the process.
auth_enabled: false

server:
  http_listen_port: ${LOKI_HTTP_PORT}
  grpc_listen_port: ${LOKI_GRPC_PORT}

common:
  path_prefix: ${LOKI_DATA}
  replication_factor: 1
  # Address this instance publishes in its rings and to the query scheduler.
  # Empty means "auto-detect from the default interface", which is right in
  # Compose. On a host with several NICs auto-detection can pick an address
  # Loki cannot reach itself on, so the bare-metal install pins it.
  instance_addr: ${LOKI_INSTANCE_ADDR}
  ring:
    instance_addr: ${LOKI_INSTANCE_ADDR}
    kvstore:
      store: inmemory

# Native OTLP ingestion (/otlp/v1/logs). Promote the most useful resource
# attributes to Loki labels; everything else stays as structured metadata.
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - service.namespace
      - deployment.environment

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: ${LOKI_OBJECT_STORE}   # s3 | filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: ${LOKI_DATA}/index
    cache_location: ${LOKI_DATA}/index_cache
  # Used when LOKI_OBJECT_STORE=filesystem; ignored otherwise.
  filesystem:
    directory: ${LOKI_DATA}/chunks
  # Used when LOKI_OBJECT_STORE=s3; ignored otherwise.
  aws:
    endpoint: ${S3_URL}
    bucketnames: ${LOKI_S3_BUCKET}
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    s3forcepathstyle: true
    insecure: ${S3_INSECURE}

compactor:
  working_directory: ${LOKI_DATA}/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: ${LOKI_OBJECT_STORE}

limits_config:
  retention_period: 2160h            # 90 days; tune per environment
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_global_streams_per_user: 10000
  allow_structured_metadata: true    # required for OTLP ingestion
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 256

analytics:
  reporting_enabled: false
