apiVersion: 1

# Backend URLs come from the environment (Grafana interpolates ${VAR} in
# provisioning files) so this file serves both Docker Compose and the
# bare-metal install. Note '$$' escapes a literal '$' for Grafana.

datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: ${MIMIR_URL}/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    jsonData:
      derivedFields:
        # Jump from a log line to its trace (structured metadata from OTLP).
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: ${TEMPO_URL}
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      tracesToMetrics:
        datasourceUid: mimir
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
